function T(p,ty){const[a,b]=rng(p),ir=x=>x.date>=a&&x.date<=b&&(!ty||(x.t||'P')==ty),bl=D.b.filter(ir),ret=D.r.filter(ir),pu=D.pu.filter(ir),ex=D.e.filter(ir);
const o={bl,ret,pu,ex,a,b,ir};o.sales=sum(bl,x=>x.sub+x.del);o.rt=sum(ret,x=>x.amt);o.pt=sum(pu,x=>x.qty*x.cost);o.et=sum(ex,x=>x.amt);
o.paid=sum(bl,x=>x.paid)+sum(D.py.filter(ir),x=>x.amt);o.itc=sum(pu,x=>x.gst||0);const pc=n=>(D.pr.find(x=>key(x.name)==key(n))||{}).cost||0;o.cogs=sum(bl,b=>sum(b.items,i=>(i.q||0)*(i.cost??pc(i.d))));o.rcogs=sum(ret,r=>(r.qty||0)*pc(r.item));o.gp=o.sales-o.rt-(o.cogs-o.rcogs);o.net=o.gp-o.et;
o.dues=[...new Set(D.b.filter(x=>!ty||x.t==ty).map(x=>x.cust))].map(n=>[n,bal(n,ty)]).filter(x=>x[1]>0.005);o.due=sum(o.dues,x=>x[1]);return o}
function TB(ir){const m={},add=(k,d,c)=>{m[k]=m[k]||[0,0];m[k][0]+=d;m[k][1]+=c};
D.b.filter(ir).forEach(x=>{add('Cash',x.paid,0);add('Debtors',x.total-x.paid,0);add('Sales',0,x.sub+x.del);add('GST Output',0,x.tax);if(x.round)add('Round off',x.round<0?-x.round:0,x.round>0?x.round:0)});
D.py.filter(ir).forEach(x=>{add('Cash',x.amt,0);add('Debtors',0,x.amt)});D.r.filter(ir).forEach(x=>{add('Sales Returns',x.amt,0);add('Debtors',0,x.amt)});

/* DATA BACKUP & EXPORT */
function dlFile(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function exportBackup(){D.lastBackup=today();logA('Backup downloaded','');save();dlFile(`Sathi_Enterprise_Backup_${today()}.json`,JSON.stringify(D,(k,x)=>k==='apiKey'?undefined:x),'application/json')}
function triggerImport() { $('importFile').click(); }
function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (importedData && importedData.p) {
                if (confirm('Are you sure you want to restore this backup? It will OVERWRITE all current data.')) {
                    const _ak=D.apiKey;delete importedData.apiKey;D = Object.assign({p:{state:'West Bengal'},c:[],pr:[],b:[],e:[],r:[],py:[],pu:[],drafts:[],sp:[],sy:[],log:[],orders:[]}, importedData);D.apiKey=_ak||DEFAULT_API_KEY;if(!D.cats)D.cats=CAT10.map((n,i)=>({id:'c'+i,name:n,subs:[]}));
                    save();
                    logA('Backup restored','');save();alert('Backup restored successfully!');
                    go(0);
                }
            } else { alert('Invalid backup file.'); }
        } catch(err) { alert('Error parsing backup file.'); }
    };
    reader.readAsText(file);e.target.value='';
}

function exportCsv(type) {
    let rows = [];
    if (type === 'reports') {
        const t = T(rp, rt);
        rows.push(['Date', 'Bill No', 'Customer', 'Type', 'Amount']);
        t.bl.forEach(x => rows.push([x.date, x.no, x.cust, x.t=='P'?'Pakka':'Kacha', (x.sub+x.del).toFixed(2)]));
    } else if (type === 'customers') {
        rows.push(['Name', 'Phone', 'City', 'Due Balance']);
        D.c.forEach(c => rows.push([c.name, c.phone, c.city, bal(c.name).toFixed(2)]));
    }
    dlFile(`${type}_export_${today()}.csv`,'\ufeff'+rows.map(e => e.map(escCsv).join(",")).join("\n"),'text/csv;charset=utf-8');

// Detect if already running in standalone mode (installed)

function checkInstallBanner() {
    const b = document.getElementById('install-banner');
    if (b) {

            b.classList.add('show');

async function installPWA() {
    if (deferredPrompt) {

async function callGeminiVision(b64, mimeType, promptText) {
    const ak = (D.apiKey || DEFAULT_API_KEY).trim();
    const models = [D.aiModel || 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
    let lastErr = null;
    for (const mod of [...new Set(models)]) {
        try {
            const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(mod) + ':generateContent?key=' + encodeURIComponent(ak);
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    generationConfig: { response_mime_type: 'application/json' },
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: mimeType || 'image/jpeg', data: b64 } }
                        ]
                    }]
                })
            });
            const data = await res.json();
            if (data.error) {
                lastErr = new Error(data.error.message);
                if (res.status === 404) continue; // try fallback model
                throw lastErr;
            }
            let t = (((data.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||'').join('');
            t = t.replace(/```json|```/g,'').trim();
            return JSON.parse(t);
        } catch (e) {
            lastErr = e;
        }
    }
    throw lastErr || new Error('Failed to analyze image.');
}

async function processBillImage(input){
    const files = input.files ? Array.from(input.files) : [];
    if(!files.length) return;
    const appendMode = $('scanAppend') ? $('scanAppend').checked : true;
    input.value = '';
    if(!D.apiKey) D.apiKey = DEFAULT_API_KEY;
    const st = $('scanStatus'), ab = $('scanAnalysisBox');
    if(st) st.innerHTML = `<span style="color:#b42318">🔍 Studying &amp; analyzing ${files.length} photo(s) with AI... please wait.</span>`;
    if(ab) ab.style.display = 'none';

    const promptText = `Carefully study and analyze this image of a bill, handwritten calculation sheet, order slip, or tabular number list.
Extract every line item or row of numbers.
- If a row has a product description, quantity, and rate, extract them.
- If a row is pure numbers (like "24 x 15" or two columns of Quantity and Rate without a product name), set 'd' to "Item #N (Qty × Rate)" and extract 'q' (quantity) and 'r' (rate).
- Also extract customer name ('cust'), phone ('phone'), or invoice date ('date' in YYYY-MM-DD) if clearly visible.
Return ONLY a valid JSON object in this exact structure:
{
  "cust": "",
  "phone": "",
  "notes": "Brief 1-line summary of what was analyzed in the image",
  "items": [
    {"d": "Product description or Row label", "q": 1, "r": 0, "u": "pcs"}
  ]
}`;

    try {
        let allItems = [], summaries = [], detectedCust = '', detectedPhone = '';
        for (let idx = 0; idx < files.length; idx++) {
            const file = files[idx];
            if(st) st.innerHTML = `<span style="color:#b42318">🔍 Studying photo ${idx+1} of ${files.length}...</span>`;
            const b64 = await new Promise((ok,no)=>{
                const r=new FileReader();
                r.onload=()=>ok(String(r.result).split(',')[1]);
                r.onerror=()=>no(new Error('Could not read image'));
                r.readAsDataURL(file);
            });
            const parsed = await callGeminiVision(b64, file.type, promptText);
            const arr = Array.isArray(parsed) ? parsed : (parsed.items || []);
            if (parsed && !Array.isArray(parsed)) {
                if (parsed.cust && !detectedCust) detectedCust = parsed.cust;
                if (parsed.phone && !detectedPhone) detectedPhone = parsed.phone;
                if (parsed.notes) summaries.push(parsed.notes);
            }
            arr.forEach((it, i) => {
                const q = +it.q || 1;
                const r = +it.r || 0;
                const d = String(it.d || `Row ${allItems.length + 1}`).trim();
                allItems.push({ d, q, r, u: it.u || 'pcs' });
            });
        }

        if(!allItems.length) throw new Error('No line items or number rows could be detected in the photo.');

        if (detectedCust && $('bn') && !v('bn')) { $('bn').value = detectedCust; fillC(); }
        if (detectedPhone && $('bph') && !v('bph')) { $('bph').value = detectedPhone; }

        if (!appendMode) {
            $('rows').innerHTML = '';
        } else {
            const ex = document.querySelectorAll('.row');
            if(ex.length===1 && !ex[0].querySelector('.d').value && !+ex[0].querySelector('.r').value) ex[0].remove();
        }

        let scanSubTotal = 0;
        const breakdownRows = [];
        allItems.forEach((it, idx) => {
            addRow();
            const rs = document.querySelectorAll('.row'), r = rs[rs.length-1];
            r.querySelector('.d').value = it.d;
            r.querySelector('.q').value = it.q;
            r.querySelector('.r').value = it.r;
            if(r.querySelector('.u')) r.querySelector('.u').value = it.u || 'pcs';
            const lineTot = it.q * it.r;
            scanSubTotal += lineTot;
            breakdownRows.push(`${idx+1}. <b>${esc(it.d)}</b>: ${it.q} × ₹${it.r} = <b>${f(lineTot)}</b>`);
        });

        calc();
        logA('AI bill photo scanned', `${allItems.length} rows · ${f(scanSubTotal)}`);

        if(st) st.innerHTML = `<span style="color:#0f6e56"><b>✓ Photo studied &amp; calculated!</b> ${allItems.length} rows added to the billing chart below.</span>`;
        if(ab) {
            ab.style.display = 'block';
            ab.innerHTML = `<b>📊 AI Study &amp; Calculation Summary (${allItems.length} items):</b>` +
                (summaries.length ? `<div class="m" style="margin:3px 0">${esc(summaries.join(' | '))}</div>` : '') +
                `<div style="max-height:140px;overflow-y:auto;margin:6px 0;line-height:1.5">${breakdownRows.join('<br>')}</div>` +
                `<div style="border-top:1px solid var(--b);padding-top:6px"><b>Scanned Items Sum Total: ${f(scanSubTotal)}</b> (All GST/discounts &amp; grand totals are updated below)</div>`;
        }
    } catch(err) {
        let msg = err.message || 'Unknown error';
        if (/API key not valid|API_KEY_INVALID|400|403/i.test(msg)) {
            msg += '\n\nTip: Click "⚙️ AI Key" to verify your Gemini API key.';
        }
        alert('Error scanning image: ' + msg);
        if(st) st.innerHTML = `<span style="color:var(--r)">⚠️ Scan failed: ${esc(err.message)}</span>`;
    }
}

async function H(s,p){const b=new TextEncoder().encode(s+'|'+p);try{const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of b)h=(h*33^c)>>>0;return'f'+h}}
function secCard(){const a=D.auth,ok=!!(D.p&&D.p.name);
if(!a)return `<div class="card np"><h3>Login security</h3>${ok?`<p class="st">Create a User ID and password. From the next time, the app asks for them when it is opened.</p><div class="g">${F('lu','User ID')}${F('lp1','Password','','password','autocomplete=new-password')}${F('lp2','Confirm password','','password','autocomplete=new-password')}</div><p><button onclick="setAuth()">Create login</button></p>`:`<p class="m">Save your business profile above first, then you can create your login here.</p>`}</div>`;
return `<div class="card np"><h3>Login security</h3><p class="st">Login is ON. User ID: <b>${esc(a.u)}</b></p><div class="g">${F('lc','Current password','','password','autocomplete=current-password')}${F('lu','New user ID',a.u)}${F('lp1','New password','','password','autocomplete=new-password')}${F('lp2','Confirm new password','','password','autocomplete=new-password')}</div><p><button onclick="setAuth()">Change login</button> <button class="o" onclick="logout()">Log out</button></p></div>`}
async function setAuth(){const u=v('lu'),p1=$('lp1').value,p2=$('lp2').value;
if(D.auth&&await H(D.auth.s,$('lc').value)!=D.auth.h)return alert('Current password is wrong');
if(u.length<3)return alert('User ID must be at least 3 characters');if(p1.length<6)return alert('Password must be at least 6 characters');if(p1!=p2)return alert('Passwords do not match');
const s=uid()+uid();D.auth={u,s,h:await H(s,p1)};save();alert('Login saved. Remember your User ID and password – they cannot be recovered.');go(0)}
let fails=0;
function lock(){document.body.classList.add('lk');$('lg').innerHTML=`<div class="card" style="width:100%;max-width:360px"><h2 style="text-align:center">${esc((D.p&&D.p.name)||'Sathi Enterprise')}</h2><p class="m" style="text-align:center">Please log in</p><form onsubmit="doLogin();return false">${F('lgu','User ID','','text','autocomplete=username autocapitalize=off')}${F('lgp','Password','','password','autocomplete=current-password')}<p><button style="width:100%">Log in</button></p></form><p id="lge" style="color:var(--r)"></p><p style="text-align:center"><button class="o" onclick="forgot()">Forgot password?</button></p></div>`;setTimeout(()=>$('lgu').focus(),50)}
async function doLogin(){const e=$('lge');if(fails>=5){e.textContent='Too many attempts. Wait 30 seconds.';return}
if(key(v('lgu'))==key(D.auth.u)&&await H(D.auth.s,$('lgp').value)==D.auth.h){fails=0;document.body.classList.remove('lk');go(0)}else{fails++;e.textContent='Wrong User ID or password.';if(fails>=5)setTimeout(()=>fails=0,30000)}}
function logout(){location.reload()}
function forgot(){if(!confirm('A forgotten password cannot be recovered. You can erase ALL data on this device and start fresh (a backup file is downloaded first). Continue?'))return;if(prompt('Type ERASE to delete all accounting data from this device')!=='ERASE')return;try{exportBackup()}catch(e){}try{localStorage.removeItem('sathi')}catch(e){}setTimeout(()=>location.reload(),1500)}

// Global Keyboard Shortcuts
document.addEventListener('keydown', e => {
    // Check if user is typing in an input/textarea
    if(document.body.classList.contains('lk'))return;const active = document.activeElement;
    const isInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT');

    // Alt + N = New Bill
    if (e.altKey && (e.key === 'n' || e.key === 'N')) {
        e.preventDefault();
        go(2); // billing
        setTimeout(() => $('bn') && $('bn').focus(), 100);
    }
    // Alt + S = Stock
    if (e.altKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        go(4); // stock
    }
    // Alt + O = Orders
    if (e.altKey && (e.key === 'o' || e.key === 'O')) {
        e.preventDefault();
        go(3);
    }
    // Esc = Close Overlays
    if (e.key === 'Escape' && document.body.classList.contains('ov')) {
        document.body.className = '';
        $('ov').innerHTML = '';
    }
    
    // Billing Enter Key Navigation (only if we are on billing page and typing in input)
    if (e.key === 'Enter' && pg === 2 && isInput) {
        e.preventDefault();
        if (e.target.classList.contains('dis')) {
            const rows = document.querySelectorAll('.row');
            if (rows.length && rows[rows.length - 1].contains(e.target)) {
                addRow();
                const newRows = document.querySelectorAll('.row');
                newRows[newRows.length - 1].querySelector('.d').focus();
                return;
            }
        }
        const focusables = Array.from(document.querySelectorAll('#v input:not([type="hidden"]):not([disabled]), #v select'));
        const i = focusables.indexOf(e.target);
        if (i > -1 && i < focusables.length - 1) focusables[i + 1].focus();
    }
});

if(D.auth)lock();else go(0);
</script></body></html>
